spring:
  application:
    name: LearnReactProg
#  threads.virtual.enabled: true

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/week20_reactive
    username: postgres
    password: root
    properties:
      fetchSize: 1000  #now JVM heap holds at most 1000 rows at a time, The rest stay in PostgreSQL until requested by backpressure from the subscriber
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql




server:
  port: 8080
  netty:
    connection-timeout: 20s
    idle-timeout: 60s
